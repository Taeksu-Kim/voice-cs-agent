# 첫 실행(2026-10-12, C'): 3/8 통과, 절차 위반 0 — runs/20261012_202214_C

- id: h1_two_cards
  task: S5
  behavior: X
  context:
    audience: consumer
    today: 2026-10-12
    customer:
      name: 김도윤
      auth_result: success
      cards:
        - {card_id: C1, name: 토스유스카드, last4: "1111"}
        - {card_id: C2, name: 토스뱅크 체크카드, last4: "2222"}
  customer:
    goal: 지갑을 통째로 잃어버려서 카드 두 장 모두 분실신고하고 싶다
    persona: 30대, 급함
    facts: {잃어버린 것: 지갑 (토스유스카드와 토스뱅크 체크카드 둘 다 들어 있음), 찾을 가능성: 없음}
    opening: 지갑을 잃어버렸어요 안에 카드 다 들어 있었는데
    behavior_note: 앱 인증 요청을 받으면 인증했다고 한다. 두 장 모두 분실신고에 동의한다.
  expect:
    dispositions: [resolved]
    tools_required: [request_app_auth, report_card_lost]
    tools_forbidden: [suspend_card]

